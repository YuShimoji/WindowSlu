name: Build and Release WindowSlu

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Regression tests
        run: dotnet test WindowSlu.Tests/WindowSlu.Tests.csproj -c Release

      - name: Restore and Publish
        working-directory: WindowSlu
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false

      - name: Create zip package
        shell: pwsh
        working-directory: WindowSlu
        run: |
          $publishPath = "bin/Release/net10.0-windows/win-x64/publish"
          $version = $env:GITHUB_REF_NAME
          $zipName = "WindowSlu-$version-win-x64.zip"
          Compress-Archive -Path "$publishPath/*" -DestinationPath "../$zipName" -Force

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            WindowSlu-*-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
